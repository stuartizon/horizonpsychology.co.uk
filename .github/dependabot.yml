# Weekly pull requests for dependency updates. Minor and patch updates come
# grouped in one pull request per ecosystem; each major update gets its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types match the Node version in .nvmrc, so their major version moves with it, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
