name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main queue
# instead, so a production deploy is never cancelled halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Reads the uploaded build, so the files that get deployed are the ones that
  # were tested.
  pages:
    name: Page tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run test:pages

  # Runs against the uploaded build, so the files that get deployed are the
  # ones that were tested. One job per browser, each at desktop and phone sizes.
  # The Playwright image comes with the browsers and their system libraries, so
  # nothing is installed with apt. Its version matches @playwright/test in
  # package-lock.json, which a unit test checks: a Playwright upgrade updates both.
  browser:
    name: Browser tests (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Browser and accessibility tests
        run: npx playwright test --project="${{ matrix.browser }}*"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Deploys the tested build to Cloudflare Pages (ADR 0015): main to
  # production, and each pull request to a preview named after its branch.
  # Pull requests from forks and from Dependabot don't get the Cloudflare
  # secrets, so they aren't deployed.
  deploy:
    name: Deploy
    needs: [check, lint, format, unit, build, pages, browser]
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write # shows a "View deployment" link on the pull request
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # installs the Wrangler version pinned in package.json
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The Worker that emails contact form enquiries (ADR 0020). Pull requests
      # deploy its preview environment, which never emails Emma. The address
      # it delivers to is private, so it's uploaded from a secret.
      - name: Deploy the enquiry email Worker
        working-directory: workers/enquiry-email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
          DELIVER_TO: ${{ github.event_name == 'pull_request' && secrets.ENQUIRY_PREVIEW_DELIVER_TO || secrets.ENQUIRY_DELIVER_TO }}
          # Shown against the deploy in Cloudflare's dashboard. Passed through
          # the environment, never into the script, as titles are untrusted.
          SUMMARY: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -n "$DELIVER_TO" || { echo "::error::The enquiry email address secret isn't set"; exit 1; }
          printf 'DELIVER_TO=%s\n' "$DELIVER_TO" > "$RUNNER_TEMP/secrets.env"
          message="${SHA::7} ${SUMMARY%%$'\n'*}"
          npx wrangler deploy --env="$ENVIRONMENT" --secrets-file="$RUNNER_TEMP/secrets.env" --message="${message::100}"
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=${{ github.head_ref || github.ref_name }}
      # wrangler-action's own GitHub deployment links to the per-deployment
      # URL, so this links to the branch preview or the live site instead.
      - name: Link the deployment from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.head_ref || github.ref_name }}
          ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
          URL: ${{ github.event_name == 'push' && 'https://horizonpsychology.co.uk' || steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          id=$(jq -n --arg ref "$REF" --arg environment "$ENVIRONMENT" \
            '{ref: $ref, environment: $environment, auto_merge: false, required_contexts: []}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=success -f environment_url="$URL" --silent
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
